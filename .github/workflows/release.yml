# SPDX-License-Identifier: GPL-2.0-only
# リリース物を作る（docs/release.md）。
#
#   版のタグ（v*）の push    … build → factory（承認が要る）→ 下書きのリリース
#   手動（workflow_dispatch）… build だけ。リリースも鍵も使わない（ワークフローの試運転用）
#
# 公開はしない。できるのは下書き（draft）までで、公開のボタンは人が押す。
#
# 更新用の鍵の扱い（docs/release.md「factory イメージと鍵」）:
#   - 鍵は environment "factory" のシークレットにだけ置く。承認者が承認するまで factory
#     ジョブは始まらず、鍵にも触れない。environment は v* のタグからしか使えない。
#   - factory ジョブでは外部の Action を 1 つも使わない（run: だけ）。同じジョブで動くコードは、
#     鍵をランナーのメモリから読めるため。動かすのは、タグの commit にある自前のスクリプト、
#     ハッシュで固定した pycryptodome、ランナーに初めから入っている道具（git・gh・python3）だけ。
#   - 第三者のソースを大量にコンパイルする build ジョブは、鍵もリリースの書き込み権限も持たない。
#   - 鍵の値は、どのジョブのログにも出さない（指紋も出さない）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 配る機種（docs/release.md）。機種ごとに rootfs・カーネル・factory・更新イメージを作る。
  # SDK とソース一式は Arch id ごとに 1 本で、その Arch id の最初の機種が作る
  BOARDS: >-
    emma3sep_softbank_poe-br100-yb1
    emma3sep_softbank_sb-tv06-wrip
  # 配布物にはビルドした場所の絶対パスが入る。手元でビルドするときと同じ場所にそろえる
  TREE: /var/tmp/openird-build/openird

jobs:
  build:
    name: build (SDK, sources, kernel, rootfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      version: ${{ steps.collect.outputs.version }}
      # images/ の全ファイルの sha256（sha256sum の形・機種ごとの <BOARD>/vmlinux.img と
      # <BOARD>/rootfs.img、カーネルのソース）。factory ジョブは成果物をこれで確かめる
      sums: ${{ steps.collect.outputs.sums }}
      kernel_sources: ${{ steps.collect.outputs.kernel_sources }}
    steps:
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libncurses-dev wget xz-utils cpio unzip rsync file \
            python3 git ca-certificates

      - name: Neutral build environment
        run: |
          # 配布物には、ビルドした機械のホスト名も入る（SDK の bin/libtool）
          echo "127.0.1.1 openird" | sudo tee -a /etc/hosts >/dev/null
          sudo hostname openird
          mkdir -p "$(dirname "$TREE")"

      - name: Source (this commit, from the public repository)
        run: |
          set -eu
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$TREE"
          cd "$TREE"
          git checkout --detach "$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$(git describe --tags --exact-match --match 'v[0-9]*')" = "$GITHUB_REF_NAME"
          fi
          git log -1 --format='%H %s'

      - name: Tests
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          # AES の層のテストは pycryptodome が無いと飛ばされる。factory ジョブと同じ、
          # ハッシュで固定した wheel を入れて走らせる
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: --target "$RUNNER_TEMP/pydeps" \
            -r host/openird-mkimage/requirements-factory.txt
          PYTHONPATH="$RUNNER_TEMP/pydeps" make test-mkimage test-fwup test-tuner test-addon test-sysupgrade

      - name: Build (SDK, corresponding sources, rootfs)
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          # make release は、版のタグを打った commit の、変更の無い checkout でだけ通る。
          # 同じ Arch id の 2 機種目からは、SDK もソース一式も足さず、パッケージが同じことを確かめる
          for b in $BOARDS; do
            echo "::group::$b"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              make release BOARD="$b"
            else
              make sdk BOARD="$b"
            fi
            echo "::endgroup::"
          done

      - name: Build (kernel)
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          for b in $BOARDS; do make kernel BOARD="$b"; done

      - name: Factory payload without the key
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          # 鍵の要らないところまで（イメージが機種の契約に合うか・write.sh の生成）をここで確かめる
          for b in $BOARDS; do
            make factory BOARD="$b" FACTORY_ARGS="--payload-only --outdir $RUNNER_TEMP/payload"
          done

      - name: Sysupgrade image
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          # OpenIRD から OpenIRD への更新イメージ（docs/sysupgrade.md）。上と同じ kernel と rootfs から作る。鍵は要らない
          for b in $BOARDS; do
            make sysupgrade BOARD="$b" SYSUPGRADE_ARGS="--outdir $RUNNER_TEMP/sysupgrade"
          done

      - name: Collect
        id: collect
        working-directory: ${{ env.TREE }}
        run: |
          set -eu
          ver="$(git describe --tags --match 'v[0-9]*' | sed 's/^v//')"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/images" "$out/release"
          ksrcs=""
          for b in $BOARDS; do
            mkdir -p "$out/images/$b"
            cp "output/$b/vmlinux.img" "output/$b/images/rootfs.img" "$out/images/$b/"
            # カーネルのソースはファミリーごと（同じものは 1 つ）
            envf="$(ls br-ext-chip-*/board/"${b%%_*}"/kernel/build.env)"
            ksrc="$( . "./$envf"; echo "$KERNEL_TARBALL" )"
            case " $ksrcs " in *" $ksrc "*) ;; *)
              cp "dl/$ksrc" "$out/images/"
              ksrcs="${ksrcs:+$ksrcs }$ksrc" ;;
            esac
          done
          if [ -d "output/release/$ver" ]; then
            cp "output/release/$ver"/* "$out/release/"
            ( cd "$out/release" && sha256sum -c SHA256SUMS )
            # 更新イメージも配布物に入れる（SHA256SUMS は factory ジョブが全部について作り直す）
            cp "$RUNNER_TEMP/sysupgrade"/*-sysupgrade.bin "$out/release/"
          fi
          sums="$(cd "$out/images" && find . -type f | sed 's#^\./##' | sort | xargs sha256sum --)"
          printf '%s\n' "$sums"
          d="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "version=$ver"
            echo "kernel_sources=$ksrcs"
            echo "sums<<$d"
            printf '%s\n' "$sums"
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      - name: Upload (kernel, rootfs, kernel source)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: ${{ runner.temp }}/out/images/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload (SDK, sources)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/out/release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  factory:
    name: factory image and draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 承認が要る。承認の前に見ること: docs/release.md「承認するときに見ること」
    environment: factory
    permissions:
      contents: write   # 下書きのリリースを作る
      actions: read     # build ジョブの成果物を取る
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      SUMS: ${{ needs.build.outputs.sums }}
      KERNEL_SOURCES: ${{ needs.build.outputs.kernel_sources }}
    steps:
      # ★ このジョブに uses: を足さないこと。鍵を読めるコードを増やさない。

      - name: Inputs from the build job
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/in"
          gh run download "$GITHUB_RUN_ID" -n images -D "$RUNNER_TEMP/in/images"
          gh run download "$GITHUB_RUN_ID" -n release -D "$RUNNER_TEMP/in/release"
          cd "$RUNNER_TEMP/in/images"
          # build ジョブが出力で渡した sha256 と、取った成果物を突き合わせる（全機種の分がそろっていること）
          printf '%s\n' "$SUMS" | sha256sum -c -
          for b in $BOARDS; do
            printf '%s\n' "$SUMS" | grep -q "  $b/vmlinux.img\$" &&
              printf '%s\n' "$SUMS" | grep -q "  $b/rootfs.img\$" ||
              { echo "$b: no kernel or rootfs from the build job"; exit 1; }
          done
          cd ../release
          sha256sum -c SHA256SUMS

      - name: Tool (the tagged commit) and its one dependency (pinned by hash)
        run: |
          set -eu
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          git checkout --detach "$GITHUB_SHA"
          test "$(git describe --tags --exact-match --match 'v[0-9]*')" = "$GITHUB_REF_NAME"
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: --target "$RUNNER_TEMP/pydeps" \
            -r host/openird-mkimage/requirements-factory.txt

      - name: Pack the factory image
        env:
          V1B_AES_KEY: ${{ secrets.V1B_AES_KEY }}
          V1B_ZIP_PASSWORD: ${{ secrets.V1B_ZIP_PASSWORD }}
        run: |
          set -eu
          umask 077
          k="$(mktemp -d)"
          trap 'rm -rf "$k"' EXIT
          if [ -z "$V1B_AES_KEY" ] || [ -z "$V1B_ZIP_PASSWORD" ]; then
            echo "environment 'factory' has no V1B_AES_KEY / V1B_ZIP_PASSWORD"
            exit 1
          fi
          printf '%s' "$V1B_AES_KEY" > "$k/key"
          printf '%s' "$V1B_ZIP_PASSWORD" > "$k/pw"
          unset V1B_AES_KEY V1B_ZIP_PASSWORD
          cd "$RUNNER_TEMP/src"
          for b in $BOARDS; do
            OPENIRD_V1B_KEY_FILE="$k/key" OPENIRD_V1B_ZIPPW_FILE="$k/pw" \
            PYTHON=python3 PYTHONPATH="$RUNNER_TEMP/pydeps" \
              scripts/make-factory.sh "$b" --version "$VERSION" \
                --kernel "$RUNNER_TEMP/in/images/$b/vmlinux.img" \
                --rootfs "$RUNNER_TEMP/in/images/$b/rootfs.img" \
                --outdir "$RUNNER_TEMP/in/release"
          done

      - name: Draft release
        run: |
          set -eu
          cd "$RUNNER_TEMP/in/release"
          # カーネルのバイナリを配るので、対応するソースを同じ場所に置く
          for s in $KERNEL_SOURCES; do cp "../images/$s" .; done
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
          pre=""
          case "$GITHUB_REF_NAME" in *-rc*) pre=--prerelease ;; esac
          {
            echo "下書きです。公開の前に、factory イメージ（\`*-factory.bin\`）を実機に書いて確かめ、"
            echo "この文面を書き直してください（docs/release.md）。"
            echo
            echo "- タグ: \`$GITHUB_REF_NAME\`（\`$GITHUB_SHA\`）"
            echo "- ビルド: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > ../notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
            --title "OpenIRD $VERSION" --notes-file ../notes.md -- *

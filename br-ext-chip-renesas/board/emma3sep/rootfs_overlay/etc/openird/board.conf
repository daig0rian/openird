# OpenIRD board configuration - POE-BR100-YB1 (Renesas EMMA3SEP, NAND 128MB)
# Read by /sbin/openird-preinit.  The kernel command line argument
# openird_overlay=<device>|none overrides OVERLAY_DEV.
#
# The writable layer is one directory of the mass-storage partition (mtd9,
# yaffs2, 64MB).  The partition is shared: the vendor system keeps data
# there and the boot loader reads update files from it, so OpenIRD only ever
# touches its own "openird" directory and never reformats the partition.
OVERLAY_DEV=/dev/mtdblock9
OVERLAY_FSTYPE=yaffs2
OVERLAY_SUBDIR=openird/overlay
# 2.6.27 has no devtmpfs: make /dev a tmpfs at boot (the tuner's chardev
# gets its device number at run time)
DEV_TMPFS=1
# What add-ons for this device are built for: SoC family (its kernel), CPU and
# libc.  ird-addon refuses an add-on whose manifest says anything else, and
# "make sdk" hands the same id to add-on authors (docs/addon.md).
ADDON_ARCH=emma3sep-mipseb-musl

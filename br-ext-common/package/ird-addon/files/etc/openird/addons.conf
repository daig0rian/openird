# OpenIRD add-on repositories - one https:// URL per line (docs/addon.md).
#
# Each URL is a directory that holds an index named "Packages" and the .ird
# files the index lists.  "ird-addon update" fetches the indexes and
# "ird-addon install <name>" installs from them.  When two repositories carry
# the same name, the one listed first here wins.
#
# The image ships no repository: what runs on this device is its owner's
# choice.  Example:
#   https://example.org/openird-addons
